id: tc_saucedemo_login
title: SauceDemo Login Test Case with Secret Credentials
priority: high

prodURL: https://www.saucedemo.com

variables:
  username: standard_user

expectedResult: Swag Labs inventory page is displayed after login.

steps:
  - type: navigate
    url: /

  - type: act
    description: Type '${username}' into the 'Username' input field

  - type: act
    description: Type '${secret.SAUCE_PASSWORD}' into the 'Password' input field

  - type: act
    description: Click on the 'Login' button

  - type: validate
    description: Verify that the product inventory container or 'Products' page title is displayed on the page
