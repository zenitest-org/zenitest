id: tc_airbnb_001
title: Airbnb Paris Stay Search Automation
priority: high

localURL: localhost:3000
prodURL: https://www.airbnb.com

variables:
  city: Paris
  checkIn: "2026-07-22"
  checkOut: "2026-07-23"

expectedResult: Airbnb search results in Paris for July 22-23 are displayed.

steps:
  - navigate: /

  - act: Type '${city}' into the 'Search destinations' or 'Where' search input field

  - act: Click on the time selection or 'Check in' date button

  - act: Select ${checkIn} as start date from the calendar

  - act: Select ${checkOut} as end date from the calendar

  - act: Click on the Search button to execute the search

  - validate: Verify that search results or stay listings in ${city} for ${checkIn} to ${checkOut} are displayed on the page
